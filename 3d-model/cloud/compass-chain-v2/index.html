  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+1.),f.x),f.y);}

    c+=vec3(.20,.34,1.0)*cell*cloud*up*1.6;

function makeGroundTex(){
  const S=2048,cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,S,S);g.translate(S/2,S/2);

  const ring=(r,w,a=1)=>{g.globalAlpha=a;g.lineWidth=w;g.beginPath();g.arc(0,0,r,0,Math.PI*2);g.stroke();};

    g.beginPath();g.moveTo(Math.cos(a)*R,Math.sin(a)*R);g.lineTo(Math.cos(a+Math.PI/2)*w,Math.sin(a+Math.PI/2)*w);
    g.lineTo(Math.cos(a+Math.PI)*0,0);g.lineTo(Math.cos(a-Math.PI/2)*w,Math.sin(a-Math.PI/2)*w);g.closePath();g.stroke();}
  // runes
  g.font='bold 54px serif';g.textAlign='center';g.textBaseline='middle';const runes='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ';
  for(let i=0;i<48;i++){const a=i/48*Math.PI*2;g.save();g.rotate(a);g.translate(0,-800);g.globalAlpha=.85;g.fillStyle='#fff';g.fillText(runes[i%runes.length],0,0);g.restore();}
  g.font='bold 40px serif';
  for(let i=0;i<24;i++){const a=i/24*Math.PI*2;g.save();g.rotate(a+.1);g.translate(0,-680);g.globalAlpha=.7;g.fillText(runes[(i*7)%runes.length],0,0);g.restore();}
  const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
function makeFloorTex(){

  const grd=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);grd.addColorStop(0,'#3a4250');grd.addColorStop(.35,'#1d222b');grd.addColorStop(1,'#07090c');

  const id=g.getImageData(0,0,S,S);for(let i=0;i<id.data.length;i+=4){const n=(Math.random()-.5)*14;id.data[i]+=n;id.data[i+1]+=n;id.data[i+2]+=n;}g.putImageData(id,0,0);

  for(let k=0;k<48;k++){const a=k/48*Math.PI*2;g.beginPath();g.moveTo(S/2+Math.cos(a)*60,S/2+Math.sin(a)*60);g.lineTo(S/2+Math.cos(a)*S,S/2+Math.sin(a)*S);g.stroke();}

  const r=g.createRadialGradient(S/2,S/2,0,S/2,S/2,S/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(soft?.25:.5,'rgba(255,255,255,.55)');r.addColorStop(1,'rgba(255,255,255,0)');

  vertexShader:`attribute float seed;varying float vA;uniform float uSize;void main(){vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=uSize*(14.+20.*seed)/-mv.z;vA=.25+.5*seed;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform sampler2D map;varying float vA;void main(){gl_FragColor=vec4(vec3(.65,.8,1.)*vA,1.)*texture2D(map,gl_PointCoord).a*.6;}`}));
dust.frustumCulled=false;scene.add(dust);
// wind streaks
// ---- storm: rain, ground splashes, lightning
const RAINN=2600,RBOX=V3(26,13,26);const rainG=new THREE.BufferGeometry(),rainP=new Float32Array(RAINN*6),rainA=new Float32Array(RAINN*2),rain=[];
const RDIR=V3(WIND.x*.22,-1,WIND.z*.22).normalize();
for(let i=0;i<RAINN;i++){rain.push({p:V3((Math.random()-.5)*RBOX.x,Math.random()*RBOX.y,(Math.random()-.5)*RBOX.z),sp:15+Math.random()*8,len:.28+Math.random()*.4});rainA[i*2]=0;rainA[i*2+1]=.35+Math.random()*.65;}
rainG.setAttribute('position',new THREE.BufferAttribute(rainP,3));rainG.setAttribute('aT',new THREE.BufferAttribute(rainA,1));
const rainMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uA:{value:0},uL:{value:0}},
  vertexShader:`attribute float aT;varying float vT;varying float vD;void main(){vT=aT;vec4 mv=modelViewMatrix*vec4(position,1.);vD=-mv.z;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform float uA,uL;varying float vT;varying float vD;void main(){float f=smoothstep(.6,2.5,vD)*smoothstep(26.,10.,vD);gl_FragColor=vec4((vec3(.42,.52,.68)+vec3(.6,.7,1.)*uL)*uA*vT*f,1.);}`});
const rainLines=new THREE.LineSegments(rainG,rainMat);rainLines.frustumCulled=false;scene.add(rainLines);
const SPLN=420,splG=new THREE.BufferGeometry(),splP=new Float32Array(SPLN*3),splL=new Float32Array(SPLN),spl=[];
for(let i=0;i<SPLN;i++){spl.push({x:0,z:0,life:Math.random()});}

const splMat=new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uA:{value:0},uL:{value:0}},
  vertexShader:`attribute float aL;varying float vL;void main(){vL=aL;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=(10.+46.*aL)/-mv.z;gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`uniform float uA,uL;varying float vL;void main(){vec2 d=gl_PointCoord-.5;d.y*=2.6;float r=length(d)*2.;float ring=smoothstep(.25,0.,abs(r-.75));gl_FragColor=vec4((vec3(.4,.5,.66)+vec3(.6,.7,1.)*uL)*ring*(1.-vL)*uA,1.);}`});

 [15.7,185,60,.4,0],[16.55,222,52,.7,1],[17.82,214,34,1.1,1],[19.3,206,29,1.2,1],[20.45,186,44,.7,1],[21.42,196,31,1.25,1],[22.7,202,37,.8,1],
 [24.3,172,46,.75,1],[25.05,190,60,.4,0],[25.75,266,31,1.2,1],[26.72,188,30,1.3,1],[27.05,176,30,1.2,1],[27.1,200,36,.8,1],[27.2,222,34,.6,1],[28.62,187,31,1.1,1],[29.55,160,60,.3,0]]

    if(t>T_FORM){const d=handPos.distanceTo(compass.position),N=Math.max(3,Math.ceil(d/PITCH)+1),vis=Math.max(2,Math.round(N*sm(T_FORM,T_GRIP-.02,t)));
      nAct=vis;for(let i=0;i<vis;i++){const u=i/(N-1);P[i].copy(handPos).lerp(compass.position,u);P[i].y-=Math.sin(u*Math.PI)*.06;}
      renderChain();if(dt>0&&Math.random()<.5)sfx.clink(.35);}
    linkMat.emissiveIntensity=2.2;
  } else {
    if(!simOn){simOn=true;initChain(t);tipPrev.copy(tipV);}
    if(dt>0){const sub=Math.max(1,Math.min(16,Math.round(dt*240)));const h=dt/sub;for(let k=1;k<=sub;k++)stepChain(t-dt+h*k,h,k/sub);}
    else{tipAt(t,tipV);P[0].copy(handPos);P[nAct-1].copy(tipV);}
    renderChain();linkMat.emissiveIntensity=2.2*(1-sm(19.3,19.9,t))+(t<T_IMPACT+.3?.2:0);
    const tip=P[nAct-1];_o.subVectors(tip,P[Math.max(0,nAct-4)]);
    if(t>=T_IMPACT&&t<T_FREE)_o.set(-.1,-.12,1); // lies where it struck
    if(_o.lengthSq()>1e-8){_o.normalize();const lim=(.12-tip.y)/.5;if(_o.y<lim){_o.y=lim;_o.normalize();}
      orbDir.lerp(_o,dt>0?1-Math.pow(.00002,dt):1).normalize();}
    compass.position.copy(tip);compass.quaternion.setFromUnitVectors(V3(0,-1,0),orbDir);
    lastTipSpeed=dt>0?tip.distanceTo(tipPrev)/dt:0;tipPrev.copy(tip);
  }
  oU.uCenter.value.copy(compass.position).addScaledVector(orbDir,.27);
  // trail
  while(trailPts.length&&(t-trailPts[trailPts.length-1].t>TRAIL_LIFE||trailPts[trailPts.length-1].t>t+1e-4))trailPts.pop();
  if(trailPts.length>TRN)trailPts.length=TRN;
  trail.visible=trailPts.length>3;
  if(trail.visible){const n=trailPts.length;const cp=camera.position;
    for(let i=0;i<TRN;i++){const k=Math.min(i,n-1),p=trailPts[k].p,q=trailPts[Math.min(k+1,n-1)].p,r=trailPts[Math.max(k-1,0)].p;
      const d=V3().subVectors(r,q);if(d.lengthSq()<1e-9)d.set(1,0,0);const side=V3().crossVectors(d,V3().subVectors(p,cp)).normalize();
      const a=i<n?Math.max(0,1-(t-trailPts[k].t)/TRAIL_LIFE):0;const w=.05+.17*Math.sin(Math.min(1,a*1.15)*Math.PI*.5);
      trPos.set([p.x+side.x*w,p.y+side.y*w,p.z+side.z*w,p.x-side.x*w,p.y-side.y*w,p.z-side.z*w],i*6);trA[i*2]=trA[i*2+1]=a;}
    trG.attributes.position.needsUpdate=trG.attributes.aA.needsUpdate=true;
    trail.material.uniforms.uI.value=clamp(lastTipSpeed/9,.25,1.5);}
  // ---- lights / fx
  summonL.intensity=7*Math.max(0,Math.sin(clamp((t-8.6)/2.4,0,1)*Math.PI))+2*sm(10,11,t)*(1-sm(16,17,t));
  orbL.position.copy(compass.position).addScaledVector(orbDir,.27);
  orbL.intensity=showC?(7*sm(17.8,18.3,t)*(1-sm(19.4,20.2,t))+1.5+ (t>19.9&&t<27.6?2.5:0)):0;
  const sinceImp=t-T_IMPACT;
  impactL.position.copy(IMPACT).setY(.6);impactL.intensity=sinceImp>0?20*Math.exp(-sinceImp*3.2):0;
  shock.visible=shock2.visible=sinceImp>0&&sinceImp<1.6;
  if(shock.visible){shock.position.copy(IMPACT).setY(.03);const r=.3+sinceImp*7;shock.scale.setScalar(r);shock.material.uniforms.uA.value=1.3*Math.exp(-sinceImp*2.5);
    shock2.position.copy(IMPACT);shock2.scale.setScalar(.2+sinceImp*3.5);shock2.material.opacity=.14*Math.exp(-sinceImp*7);}
  crack.position.x=IMPACT.x;crack.position.z=IMPACT.z;crack.material.opacity=sinceImp>0?(1.1*Math.exp(-sinceImp*.9)):0;
  runeOverlay.material.opacity=.55*Math.max(0,Math.sin(clamp((t-8.6)/2.6,0,1)*Math.PI))+.45*Math.max(0,Math.sin(clamp((t-17.6)/2.4,0,1)*Math.PI))+.35*(sinceImp>0?Math.exp(-sinceImp*1.5):0);
  runeOverlay.rotation.z=t*.12;
  groundMat.emissiveIntensity=.06+.25*runeOverlay.material.opacity;
  sky.material.uniforms.uTime.value=t;sky.material.uniforms.uPulse.value=runeOverlay.material.opacity;
  // debris
  for(let i=0;i<DEBN;i++){const d=debS[i];if(d.on&&dt>0){d.v.y-=9.8*dt;d.p.addScaledVector(d.v,dt);if(d.p.y<.03){d.p.y=.03;d.v.y*=-.3;d.v.x*=.5;d.v.z*=.5;}d.r.addScaledVector(d.v,dt*2);}
    _m.compose(d.on?d.p:V3(0,-9,0),new THREE.Quaternion().setFromEuler(new THREE.Euler(d.r.x,d.r.y,d.r.z)),V3(d.s,d.s,d.s));debris.setMatrixAt(i,_m);}
  debris.instanceMatrix.needsUpdate=true;
  // summon spark spiral while coat appears
  if(dt>0){
    if(t>8.75&&t<10.7){const yl=lerp(1.5,.2,easeIO(cr));for(let k=0;k<6;k++){const a=Math.random()*Math.PI*2;emit({p:V3(Math.cos(a)*(.35+.5*(1-yl/1.5)),yl+(Math.random()-.5)*.1,Math.sin(a)*(.3+.4*(1-yl/1.5))),v:V3(Math.cos(a)*.6,.4+Math.random()*.8,Math.sin(a)*.6).add(WIND.clone().multiplyScalar(1.2)),life:.7+Math.random()*.7,color:Math.random()<.75?0x7fd7ff:0xffd28a,size:.35+Math.random()*.35});}}
    if(t>17.8&&t<18.9){for(let k=0;k<5;k++){const a=Math.random()*Math.PI*2,r=.9+Math.random()*.4;emit({p:FLOAT_POS.clone().add(V3(Math.cos(a)*r,-.3+(Math.random()-.5)*.8,Math.sin(a)*r)),target:FLOAT_POS.clone().add(V3(0,-.25,0)),life:.8,color:0xffcf7a,size:.45});}}
    if(simOn&&t>19.9&&t<T_IMPACT&&Math.random()<lastTipSpeed/25){emit({p:compass.position.clone(),v:V3((Math.random()-.5),(Math.random()-.5),(Math.random()-.5)).multiplyScalar(1.5),life:.5,color:0xbfe2ff,size:.3});}
    if(t>27.45&&t<28.5&&Math.random()<.5){const i=1+Math.floor(Math.random()*(nAct-1));emit({p:P[i].clone(),v:V3(0,.3,0),life:.4,color:0x7fd7ff,size:.25});}
  }
  updateSparks(dt);
  // dust & streaks & fog
  const wa=windAmp(t);
  for(let i=0;i<DUSTN;i++){if(dt<=0)break;const s=dustS[i];dustP[i*3]+=(WIND.x*wa*3*(.5+s)+Math.sin(t+i)*.05)*dt;dustP[i*3+2]+=(WIND.z*wa*3*(.5+s))*dt;dustP[i*3+1]+=Math.sin(t*.7+i)*.02*dt+.03*dt;
    if(dustP[i*3]>8)dustP[i*3]-=16;if(dustP[i*3+2]<-8)dustP[i*3+2]+=16;if(dustP[i*3+1]>5)dustP[i*3+1]=0;}
  dustG.attributes.position.needsUpdate=true;
  updateStorm(t,dt);
  for(const f of fogSheets){if(dt>0){f.position.addScaledVector(WIND,dt*(.3+wa*1.2));if(f.position.x>9)f.position.x-=18;if(f.position.z<-9)f.position.z+=18;}f.rotation.z+=dt*.05;}
  // ---- camera
  if(!freeCam){const fov=cameraAt(t);camera.fov=fov;camera.updateProjectionMatrix();
    if(shake>0){const k=shake*shake*.09;camP.add(V3((Math.random()-.5)*k,(Math.random()-.5)*k,(Math.random()-.5)*k));}
    camera.position.copy(camP);camera.lookAt(camL);camera.rotateZ(camRoll);}
  else controls.update();
  shake=Math.max(0,shake-dt*1.6);
  grade.uniforms.uCA.value=.0015+ (sinceImp>0?.007*Math.exp(-sinceImp*5):0)+ .006*Math.max(0,1-Math.abs(t-8.75)*3);
  grade.uniforms.uFlash.value=Math.min(stormF,1.4)*.022+(sinceImp>0?.06*Math.exp(-sinceImp*9):0)+.03*Math.max(0,1-Math.abs(t-8.72)*6)+.02*Math.max(0,1-Math.abs(t-17.82)*6);
  grade.uniforms.uTime.value=t;
  bloom.strength=.38+(sinceImp>0?.22*Math.exp(-sinceImp*2):0)+.15*Math.max(0,Math.sin(clamp((t-8.6)/2.2,0,1)*Math.PI));
  // ---- audio
  sfx.update(wa,clamp((lastTipSpeed-3)/30,0,.55)*(simOn?1:0),300+lastTipSpeed*55,.05+.08*sm(0,8,t)+.07*sm(17,20,t));
  // ---- ui
  const ch=[...chapters].reverse().find(c=>t>=c[0]);const chEl=$('chapter');
  const html=ch[1]?`${ch[1]}<small>${ch[2]}</small>`:'';if(chEl.dataset.k!==html){chEl.dataset.k=html;chEl.style.opacity=0;setTimeout(()=>{chEl.innerHTML=html;chEl.style.opacity=html?1:0;},350);}
  $('title').style.opacity=t>28.3?1:(t<2.6&&t>.6?1:0);$('title').classList.toggle('low',true);
  if(!window.__noRender)composer.render();
}

// ---------------------------------------------------------------- loop & UI
// ---- music: "閃輝CODE" (26 s). Starts after the silent opening so its break lands on the walk and its last hit on the final pose.
const MUSIC_T0=4.0;let music=null;
import('./music.js').then(m=>{const b=atob(m.default),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);
  music=new Audio(URL.createObjectURL(new Blob([u],{type:'audio/mpeg'})));music.preload='auto';music.volume=.9;}).catch(e=>console.warn('music',e));
function musicSync(){if(!music)return;const mt=T-MUSIC_T0,dur=music.duration||26;const want=playing&&sfx.on&&mt>=0&&mt<dur-.03;
  if(!want){if(!music.paused)music.pause();return;}
  if(Math.abs(music.currentTime-mt)>.25){try{music.currentTime=mt;}catch(e){}}
  if(music.paused)music.play().catch(()=>{});}
function tick(now){requestAnimationFrame(tick);
  const dt=Math.min(.05,(now-lastNow)/1000||0);lastNow=now;if(!ready)return;
  let d=0;
  if(playing){const prev=T;T+=dt;d=dt;
    for(const [et,fn] of events)if(prev<et&&T>=et)fn();
    for(const st of STRIKES)if(prev<st.t&&T>=st.t)sfx.thunder(st.p);
    if(T>=DUR){if(loop){seek(0);}else{T=DUR;playing=false;updBtn();}}}
  renderFrame(d);musicSync();
  $('seek').value=T;$('time').textContent=`${T.toFixed(1).padStart(4,'0')} / 30.0`;
}
requestAnimationFrame(tick);
function updBtn(){$('bPlay').textContent=playing?'❚❚':'▶';}
$('start').addEventListener('click',()=>{if(!ready)return;sfx.init();sfx.resume();if(music){music.play().then(()=>{music.pause();}).catch(()=>{});}$('start').style.display='none';seek(0);playing=true;updBtn();$('ui').classList.add('show');setTimeout(()=>$('ui').classList.remove('show'),2500);});
$('bPlay').onclick=()=>{playing=!playing;if(playing){sfx.resume();if(T>=DUR)seek(0);}else sfx.suspend();updBtn();};
$('bRestart').onclick=()=>{seek(0);playing=true;sfx.resume();updBtn();};
$('seek').oninput=e=>{seek(+e.target.value);};
$('bLoop').onclick=e=>{loop=!loop;e.target.classList.toggle('on',loop);};
$('bCam').onclick=e=>{freeCam=!freeCam;controls.enabled=freeCam;e.target.classList.toggle('on',freeCam);if(freeCam){controls.target.copy(camL);}};
$('bSound').onclick=e=>{sfx.on=!sfx.on;e.target.classList.toggle('on',sfx.on);};
addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();$('bPlay').click();}});
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);composer.setSize(w,h);bloom.resolution.set(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
  const target=w/2.35;const bar=Math.max(0,(h-target)/2);$('barT').style.height=$('barB').style.height=bar+'px';$('chapter').style.top=(bar+18)+'px';}
addEventListener('resize',resize);resize();
// test hook
window.__cloud={cam:(p,l)=>{freeCam=true;camera.fov=30;camera.updateProjectionMatrix();camera.position.set(p[0],p[1],p[2]);controls.target.set(l[0],l[1],l[2]);},seek:t=>{seek(t);},step:(t,dt)=>{T=t;renderFrame(dt);},get ready(){return ready}};
</script>
